<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LA MESITA - Arena Principal</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        :root { --bg-arena: #050811; --accent-cyan: #00f0ff; --accent-red: #ff0055; --accent-gold: #ffaa00; --text-main: #ffffff; }
        
        body { 
            margin: 0; 
            padding: 30px 40px 0 40px; 
            background-color: var(--bg-arena); 
            /* Cuadrícula Arcade Estática (Costo de CPU: 0%) */
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-main); 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            box-sizing: border-box; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }

        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent-cyan); 
            padding-bottom: 15px; 
            margin-bottom: 15px; 
            z-index: 10; 
        }
        .wifi-info { 
            margin-top: 15px; 
            padding-top: 15px; 
            border-top: 1px dashed var(--accent-cyan); 
            font-family: 'Chakra Petch', sans-serif; 
            font-size: 1.3rem; 
            color: #ccc; 
            text-align: center; 
            line-height: 1.6;
        }
        .wifi-info .resalto { 
            color: var(--accent-gold); 
            font-weight: 900; 
            letter-spacing: 2px; 
        }
        .logo-container { display: flex; align-items: center; gap: 20px; }
        .club-logo { width: 90px; height: auto; object-fit: contain; }
        
        h1 { font-family: 'Chakra Petch', sans-serif; font-size: 3rem; margin: 0; letter-spacing: 4px; text-transform: uppercase; color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        
        #reloj-digital { font-family: 'Chakra Petch', sans-serif; font-size: 2.2rem; color: var(--accent-cyan); letter-spacing: 2px; background: #111; border: 1px solid var(--accent-cyan); padding: 8px 18px; border-radius: 8px; display: flex; align-items: center; }
        
        /* Animación ultra liviana del punto rojo */
        .live-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-red); margin-right: 12px; animation: blink 1.5s infinite steps(2); }
        @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }

        #pantalla-setup { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; }
        .qr-gigante { background: rgba(17, 17, 17, 0.9); border: 2px solid var(--accent-cyan); padding: 20px; border-radius: 16px; text-align: center; }
        .qr-url { font-family: 'Chakra Petch'; font-size: 1.5rem; color: var(--accent-cyan); margin-top: 15px; font-weight: bold; letter-spacing: 2px; }
        
        #roster-preview { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; max-width: 80%; }
        /* Efecto pop-in rápido al agregar jugadores (Liviano) */
        .roster-tag { background: rgba(17, 17, 17, 0.9); border: 1px solid var(--accent-cyan); color: #fff; padding: 10px 25px; border-radius: 8px; font-family: 'Chakra Petch'; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        #pantalla-juego { display: none; flex: 1; flex-direction: column; }
        .sub-header { display: flex; justify-content: center; align-items: center; margin-bottom: 10px; }
        #ronda-titulo { font-family: 'Chakra Petch', sans-serif; font-size: 3.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 4px; color: var(--accent-red); }
        
        #contenedor-principal { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding-right: 10px; }
        .arena-principal { width: 100%; display: grid; grid-template-columns: 1fr; gap: 22px; margin: auto 0; }
        
        /* Entrada en cascada acelerada por hardware (translateX es gratis para el procesador) */
        .mesa-card { background: rgba(12, 16, 29, 0.9); border: 2px solid var(--accent-cyan); border-radius: 16px; padding: 30px; display: flex; flex-direction: column; justify-content: center; position: relative; min-height: 120px; opacity: 0; transform: translateX(-30px); animation: slideIn 0.4s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .mesa-card:nth-child(1) { animation-delay: 0.1s; }
        .mesa-card:nth-child(2) { animation-delay: 0.2s; }
        .mesa-card:nth-child(3) { animation-delay: 0.3s; }
        .mesa-card:nth-child(4) { animation-delay: 0.4s; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }

        .mesa-badge { position: absolute; top: -14px; left: 30px; background: var(--accent-cyan); color: #000; font-family: 'Chakra Petch', sans-serif; font-weight: 900; padding: 4px 25px; font-size: 1.3rem; letter-spacing: 2px; }
        .enfrentamiento { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .jugador { font-size: 4.2rem; font-weight: 900; width: 40%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 1px; font-style: italic; }
        .vs { font-family: 'Chakra Petch', sans-serif; font-weight: 700; color: var(--accent-red); font-size: 2.2rem; }
        
        /* Cortina Épica optimizada (Fade simple) */
        #flash-cortina { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: var(--accent-red); display: flex; justify-content: center; align-items: center; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
        #flash-cortina.activo { opacity: 1; }
        .cartel-epico { font-family: 'Chakra Petch', sans-serif; font-size: 7rem; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 8px; transform: scale(0.8); transition: transform 0.3s ease; }
        #flash-cortina.activo .cartel-epico { transform: scale(1); }

        footer { border-top: 2px solid #333; padding-top: 15px; margin-top: 20px; display: flex; flex-direction: column; align-items: center; font-size: 1.2rem; gap: 12px; }
        .tag-descanso { display: inline-flex; align-items: center; background: #111; border: 1px solid #444; color: #aaa; padding: 4px 14px; border-radius: 6px; font-family: 'Chakra Petch', sans-serif; font-weight: 700; margin: 0 6px; }
        #proxima-info { font-weight: 700; color: var(--accent-cyan); background: #111; padding: 10px 20px; border-radius: 8px; border: 1px solid var(--accent-cyan); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; }
        .mesa-proxima-tag { background: #222; padding: 4px 10px; border-radius: 4px; white-space: nowrap; font-family: 'Chakra Petch', sans-serif; }
        
        /* Ticker Animado Liviano (translate3d usa la GPU) */
        .ticker-wrap { width: 100vw; margin-left: -40px; background: #000; border-top: 2px solid var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan); padding: 8px 0; overflow: hidden; margin-top: auto; z-index: 10; white-space: nowrap; }
        .ticker { display: inline-block; padding-left: 100%; font-family: 'Chakra Petch', sans-serif; color: var(--accent-cyan); font-weight: 700; font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; animation: ticker-scroll 25s linear infinite; }
        @keyframes ticker-scroll { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        #indicador-gesto { position: fixed; top: 100px; left: 50%; transform: translateX(-50%); background: #111; border: 2px solid var(--accent-cyan); padding: 10px 20px; border-radius: 8px; z-index: 10000; display: none; flex-direction: column; align-items: center; gap: 8px; }
        #indicador-texto { font-family: 'Chakra Petch'; color: var(--accent-cyan); font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; }
        #indicador-barra { width: 250px; height: 12px; background: #222; border-radius: 6px; overflow: hidden; }
        #indicador-progreso { width: 0%; height: 100%; background: var(--accent-red); transition: width 0.1s linear; }
    </style>
</head>
<body>
    <audio id="sfx-nueva-ronda" src="https://assets.mixkit.co/sfx/preview/mixkit-sci-fi-interface-robot-click-3143.mp3" preload="auto"></audio>
    <audio id="sfx-gesto-ok" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto"></audio>

    <div id="indicador-gesto">
        <div id="indicador-texto">DETECTANDO GESTO...</div>
        <div id="indicador-barra"><div id="indicador-progreso"></div></div>
    </div>

    <div id="flash-cortina"><div class="cartel-epico" id="texto-cortina">¡NUEVA RONDA!</div></div>

    <header>
        <div class="logo-container">
            <!-- Llamada al Logo de La Mesita -->
            <img src="/static/Logo-LMI.png" class="club-logo" alt="LMI" onerror="this.src=''; this.alt='LMI';">
            <h1>Arena</h1>
        </div>
        <div id="reloj-digital"><span class="live-dot"></span><span id="reloj-texto">00:00:00</span></div>
    </header>

    <div id="pantalla-setup">
        <div class="qr-gigante">
            <canvas id="qr-admin"></canvas>
            <div class="qr-url" id="qr-texto-url">ESCANEAR PARA ADMIN</div>
            
            <!-- PANEL DE WI-FI AÑADIDO -->
            <div class="wifi-info">
                <div>RED: <span class="resalto">LAMESITA_ADMIN</span></div>
                <div>PASS: <span class="resalto">mesita1234</span></div>
            </div>
            
        </div>
        <div id="roster-preview"></div>
    </div>

    <div id="pantalla-juego">
        <div class="sub-header">
            <div id="ronda-titulo">RONDA -</div>
        </div>
        <div id="contenedor-principal"></div>
        <footer>
            <div id="descansan-info">Descansan: -</div>
            <div id="proxima-info">Próxima fecha: -</div>
        </footer>
    </div>

    <!-- Ticker Animado (Acelerado por GPU) -->
    <div class="ticker-wrap"><div class="ticker" id="ticker-texto">CONECTANDO SISTEMA...</div></div>

    <video id="webcam" autoplay muted style="display:none;"></video>

    <script>
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('reloj-texto').innerText = 
                `${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')}:${String(ahora.getSeconds()).padStart(2,'0')}`;
        }
        setInterval(actualizarReloj, 1000); actualizarReloj();

        let ultimoJsonString = "";
        let qrGenerado = false;
        let estadoActualStr = "";

        const sfxRonda = document.getElementById('sfx-nueva-ronda');
        const sfxGesto = document.getElementById('sfx-gesto-ok');

        function mostrarCortinaEpica(numeroRonda) {
            let cortina = document.getElementById('flash-cortina');
            let textoCortina = document.getElementById('texto-cortina');
            
            sfxRonda.currentTime = 0;
            sfxRonda.play().catch(e => console.log("Audio bloqueado inicialmente"));

            textoCortina.innerText = `RONDA ${numeroRonda}`;
            cortina.classList.add('activo');
            setTimeout(() => { cortina.classList.remove('activo'); }, 800); 
        }

        function renderizarSetup(data) {
            document.getElementById('pantalla-setup').style.display = 'flex';
            document.getElementById('pantalla-juego').style.display = 'none';
            
            if (!qrGenerado && data.ip_local) {
                let adminUrl = `http://${data.ip_local}:5050/admin`;
                new QRious({ element: document.getElementById('qr-admin'), value: adminUrl, size: 250, background: 'transparent', foreground: '#00f0ff' });
                document.getElementById('qr-texto-url').innerText = adminUrl;
                qrGenerado = true;
            }

            let rosterHtml = data.jugadores.map(j => `<div class="roster-tag">${j}</div>`).join('');
            if (rosterHtml === "") rosterHtml = '<div style="color: #888; font-style: italic;">Esperando jugadores...</div>';
            document.getElementById('roster-preview').innerHTML = rosterHtml;
        }

        function renderizarJuego(data) {
            document.getElementById('pantalla-setup').style.display = 'none';
            document.getElementById('pantalla-juego').style.display = 'flex';
            document.getElementById('ronda-titulo').innerText = `RONDA ${data.numero_ronda}`;

            let htmlPartidos = '<div class="arena-principal">';
            data.ronda_actual.partidos.forEach(p => {
                htmlPartidos += `
                    <div class="mesa-card">
                        <div class="mesa-badge">MESA ${p.mesa}</div>
                        <div class="enfrentamiento">
                            <div class="jugador">${p.jugador1}</div>
                            <div class="vs">VS</div>
                            <div class="jugador">${p.jugador2}</div>
                        </div>
                    </div>`;
            });
            htmlPartidos += '</div>';
            
            // Reinyectamos para que la animación de cascada (slideIn) se dispare en cada ronda
            document.getElementById('contenedor-principal').innerHTML = htmlPartidos;

            let descansan = data.ronda_actual.descansan;
            let dTexto = (descansan && descansan.length > 0) ? descansan.map(j => `<span class="tag-descanso">${j}</span>`).join('') : '<span style="color:#555;">NINGUNO</span>';
            document.getElementById('descansan-info').innerHTML = `<span style="font-weight: 900; color: var(--accent-gold); margin-right:10px;">BANCA:</span> ${dTexto}`;
            
            if (data.proxima_ronda && data.proxima_ronda.partidos.length > 0) {
                let prox = `<span>PRÓX. (RONDA ${data.proxima_ronda.numero}):</span>`;
                data.proxima_ronda.partidos.forEach(p => { prox += `<span class="mesa-proxima-tag">Mesa ${p.mesa}: ${p.jugador1} vs ${p.jugador2}</span>`; });
                document.getElementById('proxima-info').innerHTML = prox;
            }
        }

        async function loop() {
            try {
                let res = await fetch('/api/estado');
                let data = await res.json();
                let nuevoJsonString = JSON.stringify(data);

                if (nuevoJsonString === ultimoJsonString) return; 
                ultimoJsonString = nuevoJsonString;

                // El ticker ahora se mueve solo por CSS, acá solo le actualizamos el texto
                document.getElementById('ticker-texto').innerText = data.ticker_msg;

                if (data.estado === 'setup') {
                    renderizarSetup(data);
                    estadoActualStr = 'setup';
                } else {
                    if (estadoActualStr === 'setup' || (estadoActualStr === 'jugando' && !document.getElementById('ronda-titulo').innerText.includes(data.numero_ronda))) {
                        mostrarCortinaEpica(data.numero_ronda);
                        setTimeout(() => { renderizarJuego(data); }, 300);
                    } else {
                        renderizarJuego(data); 
                    }
                    estadoActualStr = 'jugando';
                }
            } catch (e) { console.error("Error", e); }
        }
        setInterval(loop, 1000);

        let video = document.getElementById('webcam');
        let canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        
        let inicioOscuro = null;
        let cooldownCamara = false;
        const TIEMPO_REQUERIDO = 1000;
        const TIEMPO_COOLDOWN = 3000;
        let framesOmitidos = 0; 

        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            video.srcObject = stream;
            requestAnimationFrame(chequearBrillo);
        }).catch(err => console.error("Webcam bloqueada o no detectada.", err));

        function chequearBrillo() {
            // Saltamos 4 frames gráficos para ahorrar CPU al 75%
            framesOmitidos++;
            if (framesOmitidos < 4) {
                requestAnimationFrame(chequearBrillo);
                return;
            }
            framesOmitidos = 0;

            if (estadoActualStr !== 'jugando' || cooldownCamara) {
                requestAnimationFrame(chequearBrillo); return;
            }

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                let sumaLuma = 0;
                
                // Muestreamos 1 pixel cada 100 para que sea instantáneo
                for (let i = 0; i < frame.data.length; i += 100) {
                    let r = frame.data[i], g = frame.data[i+1], b = frame.data[i+2];
                    sumaLuma += (0.299*r + 0.587*g + 0.114*b);
                }
                let promedioLuma = sumaLuma / (frame.data.length / 100);

                let hudGesto = document.getElementById('indicador-gesto');
                let hudProgreso = document.getElementById('indicador-progreso');

                if (promedioLuma < 25) { 
                    if (!inicioOscuro) {
                        inicioOscuro = Date.now();
                        hudGesto.style.display = 'flex'; 
                    } else {
                        let tiempoPasado = Date.now() - inicioOscuro;
                        let porcentaje = Math.min((tiempoPasado / TIEMPO_REQUERIDO) * 100, 100);
                        hudProgreso.style.width = porcentaje + '%'; 
                        
                        if (tiempoPasado >= TIEMPO_REQUERIDO) { 
                            sfxGesto.currentTime = 0;
                            sfxGesto.play().catch(e => {});

                            fetch('/api/avanzar', { method: 'POST' });
                            inicioOscuro = null;
                            hudGesto.style.display = 'none';
                            hudProgreso.style.width = '0%';
                            
                            cooldownCamara = true;
                            setTimeout(() => { cooldownCamara = false; }, TIEMPO_COOLDOWN);
                        }
                    }
                } else {
                    inicioOscuro = null;
                    hudGesto.style.display = 'none';
                    hudProgreso.style.width = '0%';
                }
            }
            requestAnimationFrame(chequearBrillo);
        }
    </script>
</body>
</html>
