<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMI ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111; color: #fff; padding: 20px; margin: 0; }
        h1 { color: #00f0ff; text-align: center; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .card { background: #222; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        input, select { width: 100%; padding: 12px; background: #000; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 5px; box-sizing: border-box; font-family: inherit; font-size: 1rem; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background: #00f0ff; color: #000; border: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; }
        button:active { opacity: 0.8; transform: scale(0.98); }
        .btn-red { background: #ff0055; color: #fff; }
        
        .lista-jugadores { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .jugador-item { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px; border-radius: 5px; border-left: 3px solid #00f0ff; }
        .btn-quitar { background: #ff0055; color: white; width: 35px; padding: 5px; margin: 0; border-radius: 5px; }

        .partido { background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid #00f0ff; }
        .mesa-titulo { font-size: 0.9rem; color: #888; margin-bottom: 10px; }
        .vs-fila { display: flex; justify-content: space-around; align-items: center; font-size: 1.5rem; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>

    <h1>🎮 ADMIN LMI</h1>

    <div id="seccion-setup" class="card">
        <h3>1. Cargar Jugadores</h3>
        
        <select id="select-siempre">
            <option value="">-- Elegir de los de siempre --</option>
            <option value="JULIAN1">JULIAN1</option>
            <option value="JULIAN2">JULIAN2</option>
            <option value="ADRIAN">ADRIAN</option>
            <option value="LEO">LEO</option>
            <option value="RAFA">RAFA</option>
            <option value="PABLO">PABLO</option>
            <option value="EMI">EMI</option>
            <option value="LUIGGI">LUIGGI</option>
            <option value="GABI">GABI</option>
            <option value="SANTI">SANTI</option>
            <option value="MIGUEL">MIGUEL</option>
            <option value="EDU">EDU</option>
        </select>
        <button onclick="agregarDropdown()" style="padding: 10px;">AGREGAR CONOCIDO</button>

        <input type="text" id="input-nuevo" placeholder="O escribir nombre nuevo...">
        <button onclick="agregarManual()" style="padding: 10px; background: #333; color:#fff;">AGREGAR NUEVO</button>

        <h4 style="margin-top: 20px; border-bottom: 1px solid #333; padding-bottom: 5px;">ANOTADOS AHORA:</h4>
        <div class="lista-jugadores" id="lista-setup"></div>

        <button onclick="iniciarTorneo()" style="margin-top: 20px; padding: 20px; font-size: 1.3rem;">🔥 INICIAR JORNADA</button>
    </div>

    <div id="seccion-juego" style="display: none;">
        
        <div class="card">
            <h3>📡 Zócalo Deportivo</h3>
            <input type="text" id="input-ticker" placeholder="Escribí una noticia...">
            <button onclick="actualizarTicker()" style="padding: 10px; font-size: 0.9rem;">ENVIAR A PANTALLA</button>
        </div>

        <div class="card">
            <h3 id="titulo-ronda-activa" style="color: #ff0055;">RONDA ACTIVA</h3>
            <div id="contenedor-partidos"></div>
        </div>

        <button class="btn-red" onclick="avanzarRonda()" style="margin-top: 20px;">⏭️ AVANZAR RONDA MANUAL</button>

        <div class="card" style="margin-top: 30px; border-color: #ff0055;">
            <h3 style="color: #ff0055;">🚨 GESTIONAR BAJAS</h3>
            <p style="font-size: 0.8rem; color: #888;">Si alguien se va temprano, eliminalo acá.</p>
            <div class="lista-jugadores" id="lista-jugando"></div>
        </div>
    </div>

    <script>
        let estadoActual = null;

        async function fetchEstado() {
            let res = await fetch('/api/estado');
            estadoActual = await res.json();
            
            if (estadoActual.estado === 'setup') {
                document.getElementById('seccion-setup').style.display = 'block';
                document.getElementById('seccion-juego').style.display = 'none';
                renderListaJugadores('lista-setup');
            } else {
                document.getElementById('seccion-setup').style.display = 'none';
                document.getElementById('seccion-juego').style.display = 'block';
                document.getElementById('titulo-ronda-activa').innerText = `RONDA ${estadoActual.numero_ronda}`;
                document.getElementById('input-ticker').value = estadoActual.ticker_msg;
                renderizarPartidosAdmin();
                renderListaJugadores('lista-jugando');
            }
        }

        async function mandarAgregar(nombre) {
            if (!nombre) return;
            await fetch('/api/agregar_jugador', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({jugador: nombre})
            });
            fetchEstado();
        }

        function agregarDropdown() {
            let select = document.getElementById('select-siempre');
            mandarAgregar(select.value);
            select.value = "";
        }

        function agregarManual() {
            let input = document.getElementById('input-nuevo');
            mandarAgregar(input.value.toUpperCase());
            input.value = "";
        }

        async function quitarJugador(nombre) {
            if(confirm(`¿Seguro que querés eliminar a ${nombre}?`)) {
                await fetch('/api/quitar_jugador', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({jugador: nombre})
                });
                fetchEstado();
            }
        }

        function renderListaJugadores(contenedorId) {
            let html = estadoActual.jugadores.map(j => `
                <div class="jugador-item">
                    <span>${j}</span>
                    <button class="btn-quitar" onclick="quitarJugador('${j}')">X</button>
                </div>
            `).join('');
            document.getElementById(contenedorId).innerHTML = html || "<span style='color:#555;'>Nadie anotado aún...</span>";
        }

        async function iniciarTorneo() {
            let res = await fetch('/api/iniciar', { method: 'POST' });
            if (res.status === 400) alert("Cargá mínimo 2 jugadores loco");
            fetchEstado();
        }

        async function avanzarRonda() {
            if(confirm("¿Forzar avance a la próxima ronda?")) {
                await fetch('/api/avanzar', { method: 'POST' });
                fetchEstado();
            }
        }

        async function actualizarTicker() {
            let texto = document.getElementById('input-ticker').value;
            await fetch('/api/ticker', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ticker: texto})
            });
        }

        function renderizarPartidosAdmin() {
            let html = "";
            estadoActual.ronda_actual.partidos.forEach((p) => {
                html += `
                    <div class="partido">
                        <div class="mesa-titulo">MESA ${p.mesa}</div>
                        <div class="vs-fila">
                            <span style="color: #00f0ff;">${p.jugador1}</span>
                            <span style="color: #ff0055; font-size: 1rem;">VS</span>
                            <span style="color: #00f0ff;">${p.jugador2}</span>
                        </div>
                    </div>`;
            });
            document.getElementById('contenedor-partidos').innerHTML = html;
        }

        fetchEstado();
        setInterval(fetchEstado, 3000); 
    </script>
</body>
</html>
